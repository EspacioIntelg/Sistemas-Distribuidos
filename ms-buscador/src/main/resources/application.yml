server:
  port: 8082

spring:
  application:
    name: ms-buscador

  datasource:
    url: jdbc:h2:mem:buscador;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      encoding: UTF-8

  jackson:
    serialization:
      indent-output: true

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  h2:
    console:
      enabled: true
      path: /h2-console

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true